name: 고도 버전 빌드

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VER: 4.5.1-stable
  GODOT_TPL: 4.5.1.stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 고도 엔진 캐시
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VER }}

      - name: 고도 엔진 받기
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          B=https://github.com/godotengine/godot/releases/download/$GODOT_VER
          curl -sSLo editor.zip $B/Godot_v${GODOT_VER}_linux.x86_64.zip
          curl -sSLo tpl.tpz $B/Godot_v${GODOT_VER}_export_templates.tpz
          ls -la

      - name: 고도 설치
        run: |
          cd ~/godot-dl && unzip -oq editor.zip && mv -f Godot_v${GODOT_VER}_linux.x86_64 godot && chmod +x godot
          mkdir -p ~/.local/share/godot/export_templates/$GODOT_TPL
          unzip -oq tpl.tpz -d /tmp/tpl && mv -f /tmp/tpl/templates/* ~/.local/share/godot/export_templates/$GODOT_TPL/
          echo "$HOME/godot-dl" >> $GITHUB_PATH
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.5.tres
          cat ~/.config/godot/editor_settings-4.5.tres

      - name: 그림·글꼴 넣기
        run: |
          cp -r www/assets godot/assets
          mkdir -p godot/fonts
          curl -sSLo godot/fonts/GowunDodum-Regular.ttf https://github.com/google/fonts/raw/main/ofl/gowundodum/GowunDodum-Regular.ttf
          curl -sSLo godot/fonts/GowunBatang-Bold.ttf https://github.com/google/fonts/raw/main/ofl/gowunbatang/GowunBatang-Bold.ttf
          ls -la godot/fonts

      - name: 가져오기(임포트)
        run: |
          mkdir -p shots
          godot --headless --path godot --import 2>&1 | tee shots/import.log | tail -40

      - name: 스크립트 검사
        id: check
        run: |
          : > shots/check.log
          for f in godot/scripts/*.gd; do
            n=$(basename $f)
            out=$(timeout 60 godot --headless --path godot --check-only -s res://scripts/$n 2>&1 | grep -E "SCRIPT ERROR|ERROR|at:" | grep -v "Can't load the script\|is not inherited\|MainLoop\|SceneTree" || true)
            if [ -n "$out" ]; then echo "== $n" >> shots/check.log; echo "$out" >> shots/check.log; fi
          done
          cat shots/check.log
          if grep -q "Parse Error" shots/check.log; then echo "ok=false" >> $GITHUB_OUTPUT; else echo "ok=true" >> $GITHUB_OUTPUT; fi

      - name: 화면 확인용 스크린샷 · 성능
        if: steps.check.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          run() { timeout 120 xvfb-run -a -s "-screen 0 2340x1080x24" godot --path godot --rendering-driver opengl3 --resolution 2340x1080 -- "$@" 2>&1 | grep -v "^$" | tee -a shots/run.log | tail -25; }
          run --shot=$PWD/shots/title.png --mode=title --seed=7
          run --shot=$PWD/shots/floor1.png --floor=1 --seed=7
          run --shot=$PWD/shots/floor5.png --floor=5 --seed=7
          run --shot=$PWD/shots/levelup.png --floor=2 --mode=levelup --seed=4
          run --shot=$PWD/shots/bag.png --floor=3 --mode=bag --seed=4
          run --shot=$PWD/shots/talk.png --floor=1 --mode=talk --seed=4
          run --shot=$PWD/shots/pause.png --floor=7 --mode=pause --seed=5
          ls -la shots


      - name: APK 만들기
        if: steps.check.outputs.ok == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/keystore/release.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: tower
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: towerpass
        run: |
          mkdir -p build
          godot --headless --path godot --export-release "Android" ../build/apprentice-tower-godot.apk 2>&1 | tee shots/export.log | tail -40
          ls -la build
          cp build/apprentice-tower-godot.apk "apprentice-tower-godot-g0.${{ github.run_number }}.apk"

      - name: 결과(스크린샷·로그)를 ci-out 가지에 올리기
        if: always()
        run: |
          cd shots
          git init -q && git checkout -q -b ci-out
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "run ${{ github.run_number }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} ci-out

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: godot-apk
          path: apprentice-tower-godot-g0.*.apk

      - name: 릴리스에 올리기(시험판)
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(git log -1 --pretty=%B)
          gh release create "g0.${{ github.run_number }}" "apprentice-tower-godot-g0.${{ github.run_number }}.apk" \
            --title "견습마법사의 탑 고도판 g0.${{ github.run_number }}" \
            --notes "$MSG" --prerelease --latest=false
