name: APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 한글 폰트 받아서 넣기
        run: node scripts/fetch-fonts.mjs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: 파일 이름 정리
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "apprentice-tower-v0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apprentice-tower-apk
          path: apprentice-tower-v0.*.apk

      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(git log -1 --pretty=%B)
          gh release create "v0.${{ github.run_number }}" "apprentice-tower-v0.${{ github.run_number }}.apk" \
            --title "견습마법사의 탑 v0.${{ github.run_number }}" \
            --notes "$MSG" --latest
