name: 에셋 받아오기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_assets.py'
      - '.github/workflows/assets.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 내려받기
        run: python3 tools/fetch_assets.py /tmp/asset-src
      - name: asset-src 가지로 올리기
        run: |
          cd /tmp/asset-src
          du -sh . ; find . -type f | wc -l
          git init -q -b asset-src
          git config user.name "asset-bot"; git config user.email "asset-bot@users.noreply.github.com"
          git add -A && git commit -qm "에셋 원본 $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" asset-src
