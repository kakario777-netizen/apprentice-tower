plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.kakario.apprenticetower'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kakario.apprenticetower'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "0.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file('../keystore/release.jks')
            storePassword 'towerpass'
            keyAlias 'tower'
            keyPassword 'towerpass'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // 게임 본체(www 폴더)를 그대로 앱 안에 넣는다
            assets.srcDirs = ['../../www']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
